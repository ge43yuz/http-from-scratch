apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-http
  namespace: apps

spec:
  replicas: 1

  selector:
    matchLabels:
      app: go-http

  template:
    metadata:
      labels:
        app: go-http

    spec:
      containers:
        - name: server
          image: scratch-http:dev
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
